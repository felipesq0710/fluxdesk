<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fluxdesk — Suporte organizado. Fluxo eficiente. Sistema de Help Desk e gerenciamento de chamados." />
    <meta name="theme-color" content="#2457FF" />
    <meta property="og:title" content="Fluxdesk" />
    <meta property="og:description" content="Suporte organizado. Fluxo eficiente." />
    <title>Fluxdesk — Suporte organizado. Fluxo eficiente.</title>
    <script>
      // Aplica o tema antes da renderização para evitar flash.
      try {
        var t = localStorage.getItem('fluxdesk-theme');
        var dark = t === 'dark' || t === 'light' ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
